[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vajra"
version = "0.1.0"
description = "Security-native encoder-decoder transformer for real-time SOC operations"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "transformers>=4.40",
    "tokenizers>=0.19",
    "scipy>=1.12",
]

[project.optional-dependencies]
flash = ["flash-attn>=2.5"]
onnx = ["onnx>=1.16", "onnxruntime>=1.18"]
dev = ["pytest>=8.0", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
